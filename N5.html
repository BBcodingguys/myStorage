<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>もじ — Học Hiragana, Katakana &amp; Kanji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ece5d3;
  --paper-2:#e2d9c3;
  --card:#f6f1e4;
  --ink:#2b2620;
  --ink-soft:#5b5346;
  --indigo:#2f4468;
  --indigo-deep:#1c2c46;
  --indigo-soft:#dfe6f0;
  --hanko:#a6413c;
  --hanko-soft:#f2ddd9;
  --gold:#a67f2e;
  --gold-soft:#f0e6cd;
  --line:#c9bfa4;
  --ok:#3c6e47;
  --ok-soft:#dcead9;
  --bad:#a6413c;
  --bad-soft:#f2ddd9;
  --input-bg:#ffffff;
  --radius:10px;
  --shadow:0 1px 0 rgba(43,38,32,.06), 0 8px 20px -14px rgba(43,38,32,.35);
}
[data-theme="dark"]{
  --paper:#1a1713;
  --paper-2:#24201a;
  --card:#231f19;
  --ink:#ece6d8;
  --ink-soft:#a89b84;
  --indigo:#89a8de;
  --indigo-deep:#5b7ab8;
  --indigo-soft:#2b3a52;
  --hanko:#e2948e;
  --hanko-soft:#3a2624;
  --gold:#d9b968;
  --gold-soft:#3a3119;
  --line:#453c30;
  --ok:#86c996;
  --ok-soft:#21321f;
  --bad:#e2948e;
  --bad-soft:#3a2624;
  --input-bg:#2c2721;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 20px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0; overscroll-behavior:none;}
body{
  background:
    radial-gradient(1200px 500px at 50% -120px, var(--paper-2) 0%, var(--paper) 55%),
    var(--paper);
  color:var(--ink);
  font-family:'Be Vietnam Pro', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background-color .2s ease, color .2s ease;
}
.wrap{
  max-width:560px;
  margin:0 auto;
  padding:18px 16px 60px;
  min-height:100vh;
}
.brandbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:5;
  background:var(--paper);
  padding-top:6px;
}
.brand{
  font-family:'Noto Sans JP', 'Be Vietnam Pro', sans-serif;
  font-weight:800;
  font-size:20px;
  color:var(--indigo-deep);
  letter-spacing:.02em;
  cursor:pointer;
  user-select:none;
  display:flex;
  align-items:center;
  gap:8px;
}
.brand .bglyph{font-size:24px;}
.brand small{
  display:block;
  font-family:'Be Vietnam Pro', sans-serif;
  font-weight:500;
  font-size:10.5px;
  color:var(--ink-soft);
  letter-spacing:.01em;
  margin-top:1px;
}
.reset-link{
  font-size:11.5px;
  color:var(--ink-soft);
  background:none;
  border:none;
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:3px;
  padding:4px;
  font-family:'Be Vietnam Pro', sans-serif;
  flex:none;
}
.reset-link:hover{color:var(--hanko);}

/* ---------- generic layout bits ---------- */
.hero{
  text-align:center;
  padding:14px 6px 24px;
}
.hero-glyphs{
  font-family:'Noto Sans JP', sans-serif;
  font-size:46px;
  line-height:1;
  color:var(--indigo);
  margin-bottom:10px;
  letter-spacing:.08em;
}
.hero h1{
  font-family:'Noto Sans JP', sans-serif;
  font-size:23px;
  font-weight:900;
  margin:0 0 8px;
  color:var(--ink);
}
.hero p{
  color:var(--ink-soft);
  font-size:14px;
  margin:0;
  line-height:1.55;
}
h2.section-title{
  font-family:'Noto Sans JP', sans-serif;
  font-size:19px;
  font-weight:900;
  margin:0 0 4px;
  color:var(--ink);
}
.section-sub{
  color:var(--ink-soft);
  font-size:13.5px;
  margin:0 0 16px;
  line-height:1.5;
}
.backrow{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}
.backbtn{
  background:var(--card);
  border:1px solid var(--line);
  color:var(--ink);
  width:36px;height:36px;
  border-radius:9px;
  cursor:pointer;
  font-size:17px;
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.backbtn:hover{border-color:var(--indigo);color:var(--indigo);}

/* ---------- progress bar ---------- */
.pbar-outer{
  height:8px;
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:6px;
  overflow:hidden;
  margin:8px 0 4px;
}
.pbar-inner{
  height:100%;
  background:linear-gradient(90deg, var(--indigo) 0%, var(--gold) 100%);
  border-radius:6px;
  transition:width .3s ease;
}
.pbar-caption{
  font-size:12px;
  color:var(--ink-soft);
  margin-bottom:16px;
}

/* ---------- big choice tiles ---------- */
.tile-grid{
  display:grid;
  gap:12px;
}
.tile{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 18px;
  cursor:pointer;
  text-align:left;
  box-shadow:var(--shadow);
  transition:transform .12s ease, border-color .12s ease;
  display:flex;
  align-items:center;
  gap:14px;
}
.tile:hover{border-color:var(--indigo); transform:translateY(-1px);}
.tile:active{transform:translateY(0);}
.tile-glyph{
  font-family:'Noto Sans JP', sans-serif;
  font-size:30px;
  color:var(--indigo);
  flex:none;
  width:52px;
  text-align:center;
  line-height:1;
}
.tile-body h3{
  margin:0 0 3px;
  font-size:16px;
  font-weight:700;
}
.tile-body p{
  margin:0;
  font-size:12.5px;
  color:var(--ink-soft);
  line-height:1.5;
}
.tile-progress{
  margin-top:7px;
  font-size:11.5px;
  color:var(--gold);
  font-weight:600;
}

/* ---------- daily kanji widget ---------- */
.reco-card{
  background:var(--gold-soft);
  border:1px solid var(--gold);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:16px;
}
.reco-title{font-size:13px; font-weight:800; color:#7a5f22; margin-bottom:10px;}
[data-theme="dark"] .reco-title{color:var(--gold);}
.reco-list{display:flex; flex-direction:column; gap:8px;}
.reco-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink);}
.reco-row .reco-count{flex:1; color:var(--ink-soft);}
.reco-row .chip-btn{padding:5px 12px; font-size:11px;}

.daily-card{
  background:linear-gradient(135deg, var(--indigo-soft) 0%, var(--card) 70%);
  border:1px solid var(--indigo);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:16px;
  cursor:pointer;
  box-shadow:var(--shadow);
}
.daily-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  font-weight:700;
  color:var(--indigo-deep);
  margin-bottom:8px;
  letter-spacing:.02em;
}
.daily-streak{color:var(--hanko); font-weight:700;}
.daily-body{display:flex; align-items:center; gap:14px;}
.daily-glyph{
  font-family:'Noto Sans JP', sans-serif;
  font-size:46px;
  color:var(--ink);
  flex:none;
  width:64px;
  text-align:center;
}
.daily-info{flex:1; min-width:0;}
.daily-meaning{font-size:14px; font-weight:700; color:var(--ink); margin-bottom:2px;}
.daily-reading{font-size:11.5px; color:var(--indigo); margin-bottom:2px;}
.daily-example{font-size:11.5px; color:var(--ink-soft);}

/* ---------- kana/kanji group grid ---------- */
.group-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(92px,1fr));
  gap:9px;
  margin-bottom:18px;
}
.group-tile{
  position:relative;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px 8px 10px;
  text-align:center;
  cursor:pointer;
  transition:border-color .12s ease, background .12s ease;
}
.group-tile:hover{border-color:var(--indigo);}
.group-tile.checked{
  border-color:var(--indigo);
  background:var(--indigo-soft);
}
.group-tile.learned::after{
  content:"✓";
  position:absolute;
  top:5px; right:6px;
  font-size:11px;
  font-weight:900;
  color:#fff;
  background:var(--ok);
  border-radius:50%;
  width:16px;height:16px;
  line-height:16px;
  text-align:center;
}
.group-tile .gk{
  font-family:'Noto Sans JP', sans-serif;
  font-size:18px;
  color:var(--ink);
  display:block;
  margin-bottom:3px;
  letter-spacing:.02em;
}
.group-tile .gr{
  font-size:10px;
  color:var(--ink-soft);
  letter-spacing:.01em;
}

/* ---------- individual character picker (review picker) ---------- */
.picker-section{margin-bottom:18px;}
.picker-section-head{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:8px; font-size:12.5px; font-weight:700; color:var(--ink-soft);
}
.picker-section-head .chip-btn{padding:4px 10px; font-size:10.5px;}
.mastery-legend{
  font-size:11px; color:var(--ink-soft); margin:0 0 14px; line-height:1.7;
}
.mastery-legend span{font-weight:700; padding:1px 6px; border-radius:5px;}
.mastery-legend .m-poor{background:var(--bad-soft); color:var(--bad);}
.mastery-legend .m-ok{background:var(--gold-soft); color:var(--gold);}
.mastery-legend .m-good{background:var(--indigo-soft); color:var(--indigo);}
.mastery-legend .m-great{background:var(--ok-soft); color:var(--ok);}

.char-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(48px,1fr));
  gap:7px;
}
.char-tile{
  position:relative;
  background:var(--card);
  border:1.5px solid var(--line);
  border-radius:8px;
  padding:9px 2px 7px;
  text-align:center;
  cursor:pointer;
}
.char-tile:hover{border-color:var(--indigo);}
.char-tile.selected{border-color:var(--indigo); background:var(--indigo-soft);}
.ct-glyph{
  font-family:'Noto Sans JP', sans-serif;
  font-size:17px;
  color:var(--ink);
}
.ct-badge{
  position:absolute; top:-6px; right:-6px;
  font-size:9px; font-weight:800; color:#fff;
  min-width:16px; height:16px; line-height:16px;
  border-radius:8px; text-align:center; padding:0 3px;
}
.ct-badge-inline{ position:static; margin-left:auto; flex:none; }
.m-poor{background:var(--bad);}
.m-ok{background:var(--gold);}
.m-good{background:var(--indigo);}
.m-great{background:var(--ok);}
.m-none{background:var(--line); color:var(--ink-soft);}

.vocab-pick-row{
  display:flex; align-items:center; gap:10px;
  background:var(--card); border:1.5px solid var(--line); border-radius:8px;
  padding:10px 12px; margin-bottom:6px; cursor:pointer;
}
.vocab-pick-row:hover{border-color:var(--indigo);}
.vocab-pick-row.selected{border-color:var(--indigo); background:var(--indigo-soft);}
.vpr-check{
  width:18px; height:18px; flex:none;
  border:1.5px solid var(--line); border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; color:var(--indigo); font-weight:800;
}
.vpr-text{
  flex:1; min-width:0;
  font-family:'Noto Sans JP', sans-serif;
  font-size:13.5px; color:var(--ink);
}

.quickrow{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}
.chip-btn{
  background:var(--card);
  border:1px solid var(--line);
  color:var(--ink);
  padding:7px 13px;
  border-radius:999px;
  font-size:12.5px;
  cursor:pointer;
  font-family:'Be Vietnam Pro', sans-serif;
  font-weight:500;
}
.chip-btn:hover{border-color:var(--indigo); color:var(--indigo);}
.chip-btn.chip-active{border-color:var(--indigo); background:var(--indigo-deep); color:#f4efe1;}

.selcount{
  font-size:13px;
  color:var(--ink-soft);
  margin-bottom:14px;
}
.selcount b{color:var(--indigo-deep);}

.primary-btn{
  width:100%;
  background:var(--indigo-deep);
  color:#f4efe1;
  border:none;
  padding:15px 18px;
  border-radius:9px;
  font-size:15.5px;
  font-weight:700;
  cursor:pointer;
  font-family:'Be Vietnam Pro', sans-serif;
  transition:background .12s ease;
}
.primary-btn:hover{background:var(--indigo);}
.primary-btn:disabled{background:#b9b2a0; cursor:not-allowed;}
.secondary-btn{
  width:100%;
  background:transparent;
  color:var(--ink);
  border:1px solid var(--line);
  padding:13px 18px;
  border-radius:9px;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
  font-family:'Be Vietnam Pro', sans-serif;
  margin-top:9px;
}
.secondary-btn:hover{border-color:var(--indigo); color:var(--indigo);}

/* ---------- flashcard ---------- */
.card-stage{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:26px 20px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.card-stage::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg, var(--indigo) 0%, var(--indigo) 40%, var(--hanko) 40%, var(--hanko) 55%, var(--gold) 55%, var(--gold) 100%);
}
.progress-line{
  font-size:12px;
  color:var(--ink-soft);
  margin-bottom:6px;
  letter-spacing:.03em;
}
.flash-glyph{
  font-family:'Noto Sans JP', sans-serif;
  font-size:88px;
  color:var(--ink);
  line-height:1;
  margin:16px 0 8px;
}
.flash-romanji{
  font-size:19px;
  color:var(--indigo);
  font-weight:700;
  letter-spacing:.04em;
  margin-bottom:16px;
}
.flash-meaning{
  font-size:17px;
  color:var(--ink);
  font-weight:700;
  margin-bottom:10px;
}
.flash-note{
  background:var(--gold-soft);
  border:1px dashed var(--gold);
  border-radius:8px;
  padding:8px 12px;
  font-size:12.5px;
  color:var(--ink);
  text-align:left;
  margin-top:-6px;
  margin-bottom:10px;
}
.kanji-readings{
  display:flex;
  justify-content:center;
  gap:16px;
  font-size:13.5px;
  color:var(--indigo-deep);
  margin-bottom:12px;
  flex-wrap:wrap;
}
.rlabel{
  font-size:10.5px;
  color:var(--ink-soft);
  font-weight:700;
  margin-right:4px;
  text-transform:uppercase;
  letter-spacing:.03em;
}
.kanji-example{
  background:var(--indigo-soft);
  border-radius:8px;
  padding:9px 12px;
  font-size:13.5px;
  color:var(--ink);
  margin:0 0 14px;
  display:inline-block;
}
.kanji-example b{color:var(--indigo-deep);}
.icon-btn{
  background:var(--indigo-soft);
  border:1px solid var(--line);
  color:var(--indigo-deep);
  width:40px;height:40px;
  border-radius:50%;
  cursor:pointer;
  font-size:16px;
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:18px;
}
.icon-btn:hover{background:#cdd9ea;}
.dotrow{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:4px;
  flex-wrap:wrap;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--line);
}
.dot.on{background:var(--indigo);}

/* ---------- vocab list ---------- */
.vocab-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:18px;
}
.vocab-item{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px 13px;
  display:flex;
  align-items:center;
  gap:12px;
}
.vocab-kana{
  font-family:'Noto Sans JP', sans-serif;
  font-size:22px;
  color:var(--ink);
  min-width:60px;
  text-align:center;
  flex:none;
}
.vocab-meta{flex:1; min-width:0;}
.vocab-romanji{
  font-size:12.5px;
  color:var(--indigo);
  font-weight:700;
  margin-bottom:2px;
}
.vocab-meaning{
  font-size:12px;
  color:var(--ink-soft);
}
.mini-speak{
  background:none;
  border:1px solid var(--line);
  color:var(--ink-soft);
  width:30px;height:30px;
  border-radius:50%;
  cursor:pointer;
  font-size:13px;
  flex:none;
}
.mini-speak:hover{border-color:var(--indigo); color:var(--indigo);}
.empty-note{
  background:var(--gold-soft);
  border:1px solid var(--gold);
  border-radius:9px;
  padding:14px 16px;
  font-size:13px;
  color:var(--ink);
  margin-bottom:18px;
  line-height:1.55;
}

/* ---------- quiz ---------- */
.quiz-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  font-size:12.5px;
  color:var(--ink-soft);
}
.quiz-score{
  font-weight:700;
  color:var(--indigo-deep);
}
.progbar{
  height:5px;
  background:var(--paper-2);
  border-radius:4px;
  overflow:hidden;
  margin-bottom:18px;
}
.progbar-fill{
  height:100%;
  background:var(--indigo);
  transition:width .25s ease;
}
.qtype-label{
  font-size:11.5px;
  letter-spacing:.02em;
  color:var(--gold);
  font-weight:700;
  margin-bottom:12px;
}
.q-prompt-glyph{
  font-family:'Noto Sans JP', sans-serif;
  font-size:72px;
  line-height:1;
  margin:4px 0 4px;
}
.q-prompt-word{
  font-family:'Noto Sans JP', sans-serif;
  font-size:40px;
  line-height:1.2;
  margin:4px 0 4px;
  word-break:break-word;
}
.q-prompt-romanji{
  font-family:'Noto Sans JP', sans-serif;
  font-size:34px;
  color:var(--indigo-deep);
  margin:4px 0 2px;
  letter-spacing:.02em;
}
.q-hint{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-bottom:4px;
  line-height:1.5;
}
.answer-row{
  display:flex;
  gap:8px;
  margin:16px 0 4px;
}
.answer-input{
  flex:1;
  padding:13px 14px;
  font-size:16px;
  border:1.5px solid var(--line);
  border-radius:9px;
  background:var(--input-bg);
  color:var(--ink);
  font-family:'Be Vietnam Pro', sans-serif;
}
.answer-input:focus{outline:none; border-color:var(--indigo);}
.answer-input.correct{border-color:var(--ok); background:var(--ok-soft);}
.answer-input.wrong{border-color:var(--bad); background:var(--bad-soft);}
.check-btn{
  background:var(--indigo-deep);
  color:#f4efe1;
  border:none;
  padding:0 20px;
  border-radius:9px;
  font-weight:700;
  cursor:pointer;
  font-size:14.5px;
}
.check-btn:hover{background:var(--indigo);}
.check-btn:disabled{background:#b9b2a0;}
.check-btn.ok-btn{background:var(--ok); flex:1;}
.check-btn.ok-btn:hover{background:#2f5837;}
.check-btn.bad-btn{background:var(--bad); flex:1;}
.check-btn.bad-btn:hover{background:#8a332f;}

.feedback{
  margin-top:14px;
  padding:12px 14px;
  border-radius:9px;
  font-size:13.5px;
  text-align:left;
  line-height:1.55;
  display:none;
}
.feedback.show{display:block;}
.feedback.ok{background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok);}
.feedback.bad{background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad);}
.feedback b{display:block; margin-bottom:2px; font-size:14px;}

.next-btn{
  margin-top:14px;
  width:100%;
  background:var(--indigo-deep);
  color:#f4efe1;
  border:none;
  padding:13px;
  border-radius:9px;
  font-weight:700;
  font-size:14.5px;
  cursor:pointer;
  display:none;
}
.next-btn.show{display:block;}
.next-btn:hover{background:var(--indigo);}

/* ---------- handwriting canvas ---------- */
.write-stage{
  position:relative;
  width:220px; height:220px;
  margin:14px auto 10px;
  border:2px solid var(--line);

/* =====================================================================
   MASTERY — điểm thành thạo 0-100 mỗi chữ/từ, dựa trên độ chính xác + tốc độ
   trả lời. Thang điểm: <40 Chưa tốt · 40-64 Ổn · 65-84 Tốt · 85-100 Giỏi
===================================================================== */
const MASTERY_TIERS = [
  { max:40,  label:'Chưa tốt', cls:'m-poor' },
  { max:65,  label:'Ổn',       cls:'m-ok'   },
  { max:85,  label:'Tốt',      cls:'m-good' },
  { max:101, label:'Giỏi',     cls:'m-great'},
];
function masteryOf(table, key){
  const v = (LS.mastery[table]||{})[key];
  return (v===undefined) ? null : v;
}
function masteryTier(score){
  if(score===null || score===undefined) return { label:'Chưa luyện', cls:'m-none' };
  for(const t of MASTERY_TIERS){ if(score < t.max) return t; }
  return MASTERY_TIERS[MASTERY_TIERS.length-1];
}
const SPEED_PROFILES = {
  typing:  { fast:2500, slow:10000 },
  writing: { fast:6000, slow:20000 },
  choice:  { fast:3000, slow:9000  },
  flip:    { fast:1500, slow:6000  },
};
function speedProfileForType(type){
  if(type==='romanji2char' || type==='kanjiWrite') return SPEED_PROFILES.writing;
  if(type==='listenChoice') return SPEED_PROFILES.choice;
  if(type==='flip') return SPEED_PROFILES.flip;
  return SPEED_PROFILES.typing;
}
function computePerf(ok, elapsedMs, type){
  if(!ok) return 0;
  const prof = speedProfileForType(type);
  const e = (typeof elapsedMs === 'number' && elapsedMs >= 0) ? elapsedMs : prof.slow;
  if(e <= prof.fast) return 100;
  if(e >= prof.slow) return 45;
  const ratio = (e - prof.fast) / (prof.slow - prof.fast);
  return Math.round(100 - ratio*55);
}
function updateMastery(table, key, perf){
  LS.mastery[table] = LS.mastery[table] || {};
  const cur = LS.mastery[table][key];
  const alpha = 0.35;

  const scored = ja.map(v=>{

    if(n.includes('kyoko') || n.includes('otoya') || n.includes('haruka') || n.includes('ayumi') || n.includes('sayaka')) score += 3;

function romanjiToHira(input){
  let s=(input||'').toString().trim().toLowerCase(),o='',i=0;
  while(i<s.length){const ch=s[i];
    if(/[\\s]/.test(ch)){o+=ch;i++;continue;}
    if(/[,.!?;:、。！？「」『』()（）"'’”“\-]/.test(ch)){o+=ch;i++;continue;}
    if(i+1<s.length && s[i]===s[i+1] && /[bcdfghjklmpqrstvwxyz]/.test(s[i]) && s[i]!=='n'){o+='っ';i++;continue;}
    if(s.slice(i,i+2)==='nn'){o+='ん';i+=2;continue;}
    let hit=null; for(const x of ROMAJI_HIRA){if(s.startsWith(x[0],i)){hit=x;break;}}
    if(hit){o+=hit[1];i+=hit[0].length;} else {o+=ch;i++;}
  }
  return o;
}

function hiraToRomaji(h){
  const pairs=ROMAJI_HIRA.slice().sort((a,b)=>b[1].length-a[1].length || b[0].length-a[0].length);
  let out='',i=0;
  while(i<h.length){
    if(h[i]==='っ' && i+1<h.length){
      let next=null; for(const p of pairs){if(h.startsWith(p[1],i+1)){next=p;break;}}
      if(next){const cons=next[0].match(/^[bcdfghjklmnpqrstvwxyz]/); if(cons) out+=cons[0]; i++; continue;}

    let hit=null; for(const p of pairs){if(h.startsWith(p[1],i)){hit=p;break;}}
    if(hit){out+=hit[0];i+=hit[1].length;} else {out+=h[i];i++;}
  }

}

/* =====================================================================
   LEARN GRID + FLASHCARDS + VOCAB
===================================================================== */
function renderLearnGrid(){
  const learned = learnedSet();
  const tiles = groups().map((g,gi)=>{
    const cls = learned.has(gi) ? 'group-tile learned' : 'group-tile';
    let sample;
    if(isVocabTable()){
      const t = (g.chars[0]||{k:'—'}).k;
      sample = t.length>5 ? t.slice(0,5)+'…' : t;
    } else {
      sample = g.chars.filter(c=>!c.special).slice(0,3).map(c=>c.k).join('') || g.chars[0].k;
    }
    return `<div class="${cls}" onclick="${g.chars.length?`startFlashcards(${gi})`:''}">
      <span class="gk" ${isVocabTable()?'style="font-size:14px;"':''}>${esc(sample)}</span>
      <span class="gr">${esc(g.label)}</span>
    </div>`;
  }).join('');
  const heading = isVocabTable() ? 'Chọn chủ đề để học' : 'Chọn nhóm chữ để học';
  const sub = isVocabTable() ? 'Dấu ✓ xanh là chủ đề bạn đã học. Bấm vào bất kỳ chủ đề nào để học hoặc ôn lại.' : 'Dấu ✓ xanh là nhóm bạn đã học. Bấm vào bất kỳ nhóm nào để học hoặc ôn lại.';
  app.innerHTML = `
    <div class="backrow">
      <button class="backbtn" onclick="goTableMenu()">←</button>
      <h2 class="section-title">${heading}</h2>
    </div>
    <p class="section-sub">${sub}</p>
    <div class="group-grid">${tiles}</div>
  `;
}

function startFlashcards(gi){
  state.currentGroup = gi;
  state.cardIdx = 0;
  state.screen = 'flashcards';
  render();
}

function renderFlashcards(){
  const g = groups()[state.currentGroup];
  const chars = g.chars.filter(c=>!c.special).length ? g.chars.filter(c=>!c.special) : g.chars;
  const i = state.cardIdx;
  const c = chars[i];
  const isLast = i === chars.length-1;
  const dots = chars.map((_,idx)=>`<span class="dot ${idx===i?'on':''}"></span>`).join('');

  let bodyHtml;
  if(state.table==='kanji'){
    bodyHtml = `
      <div class="flash-glyph">${esc(c.k)}</div>
      <div class="flash-meaning">${esc(c.meaning)}</div>
      <div class="kanji-readings">
        <div><span class="rlabel">On</span>${esc(c.on.join('、')||'—')}</div>
        <div><span class="rlabel">Kun</span>${esc(c.kun.join('、')||'—')}</div>
      </div>
      <div class="kanji-example"><b>${esc(c.example.kana)}</b> (${esc(c.example.romanji)}) — ${esc(c.example.meaning)}</div>
      ${mnemoHtml(c)}
      <br>
      <div style="display:flex; gap:10px; justify-content:center; margin-bottom:18px;">
        <button class="icon-btn" onclick="speak('${esc(c.example.kana)}')" title="Nghe ví dụ">🔊</button>
        ${spkBtn(c.example.kana,c.example.romanji,c.example.meaning)}
        <button class="icon-btn" onclick="toggleStarUI('${esc(c.k)}')" title="Đánh dấu để ôn thêm">${isStarred(state.table,c.k)?'⭐':'☆'}</button>
        <button class="icon-btn" onclick="editNote('${esc(c.k)}')" title="Ghi chú riêng">📝</button>
      </div>
      ${noteOf(state.table,c.k) ? `<div class="flash-note">📝 ${esc(noteOf(state.table,c.k))}</div>` : ''}
    `;
  } else if(isVocabTable()){
    const bigFont = c.k.length > 8 ? 'font-size:34px;' : '';
    bodyHtml = `
      <div class="flash-glyph" style="${bigFont}">${jpDisplay(c.k,c.r,'vocab-main')}</div>
      <div class="flash-romanji">${esc(c.r)}</div>
      <div class="flash-meaning" style="font-size:15px;">${esc(c.m)}</div>
      <div style="display:flex; gap:10px; justify-content:center; margin-bottom:18px; margin-top:8px;">
        <button class="icon-btn" onclick="speak('${esc(c.k)}')" title="Nghe phát âm">🔊</button>
        ${spkBtn(c.k,c.r,c.m)}
        <button class="icon-btn" onclick="toggleStarUI('${esc(c.k)}')" title="Đánh dấu để ôn thêm">${isStarred(state.table,c.k)?'⭐':'☆'}</button>
        <button class="icon-btn" onclick="editNote('${esc(c.k)}')" title="Ghi chú riêng">📝</button>
      </div>
      ${noteOf(state.table,c.k) ? `<div class="flash-note">📝 ${esc(noteOf(state.table,c.k))}</div>` : ''}
    `;
  } else {
    const romanjiLine = c.special ? '(không có âm riêng — biến đổi âm chữ theo sau)' : c.r;
    bodyHtml = `
      <div class="flash-glyph">${esc(c.k)}</div>
      <div class="flash-romanji">${esc(romanjiLine)}</div>
      <div style="display:flex; gap:10px; justify-content:center; margin-bottom:18px;">
        <button class="icon-btn" onclick="speak('${esc(c.k)}')" title="Nghe phát âm">🔊</button>
        ${c.special?'':spkBtn(c.k,c.r,'')}
        <button class="icon-btn" onclick="toggleStarUI('${esc(c.k)}')" title="Đánh dấu để ôn thêm">${isStarred(state.table,c.k)?'⭐':'☆'}</button>
        <button class="icon-btn" onclick="editNote('${esc(c.k)}')" title="Ghi chú riêng">📝</button>
      </div>
      ${noteOf(state.table,c.k) ? `<div class="flash-note">📝 ${esc(noteOf(state.table,c.k))}</div>` : ''}
    `;
  }

  app.innerHTML = `
    <div class="backrow">
      <button class="backbtn" onclick="goLearnGrid()">←</button>
      <h2 class="section-title">${isVocabTable()?'Chủ đề':'Nhóm'} ${esc(g.label)}</h2>
    </div>
    <div class="card-stage">
      <div class="progress-line">${isVocabTable()?'Mục':'Chữ'} ${i+1}/${chars.length}</div>
      ${bodyHtml}
      <div class="dotrow">${dots}</div>
    </div>
    <button class="primary-btn" style="margin-top:16px;" onclick="nextFlashcard(${isLast})">${isLast ? (isVocabTable()?'Hoàn thành chủ đề ✓':'Hoàn thành nhóm ✓') : (isVocabTable()?'Mục tiếp theo →':'Chữ tiếp theo →')}</button>
    ${noteModalHtml()}
  `;
}

function nextFlashcard(isLast){
  if(isLast){
    markLearned(state.currentGroup);
    state.fromVocabGroup = state.currentGroup;
    state.screen = 'vocab';
    render();
  } else {
    state.cardIdx++;
    render();
  }
}

function renderVocab(){
  const g = groups()[state.fromVocabGroup];
  const learned = learnedSet();
  let shown, cs, countLine;
  if(state.table==='kanji'){
    const examples = [];
    learned.forEach(gi=>{ groups()[gi].chars.forEach(c=>{
      examples.push({w:c.example.kana, r:c.example.romanji, m:`${c.example.meaning} (chữ ${c.k})`});
    }); });
    shown = shuffle(examples).slice(0,14);
    cs = new Set([...learned]);
    countLine = `Đây là các từ ví dụ từ ${learned.size} nhóm Kanji bạn đã học.`;
  } else if(isVocabTable()){
    shown = g.chars.map(c=>({w:c.k, r:c.r, m:c.m}));
    countLine = `Đây là toàn bộ ${shown.length} mục trong chủ đề "${g.label}" bạn vừa học — ôn lại một lượt trước khi qua chủ đề khác.`;
  } else {
    cs = charsOfGroups(learned);
    shown = shuffle(wordsWithinChars(cs)).slice(0,14);
    countLine = `Đây là những từ chỉ dùng các chữ bạn đã học tính đến bây giờ (${cs.size} chữ).`;
  }
  let body;
  if(shown.length===0){
    body = `<div class="empty-note">Chưa có ví dụ nào chỉ dùng những chữ bạn đã học. Học thêm một vài nhóm nữa rồi quay lại đây — danh sách sẽ tự mở rộng.</div>`;
  } else {
    body = `<div class="vocab-list">` + shown.map(w=>`
      <div class="vocab-item">
        <div class="vocab-kana">${jpDisplay(w.w,w.r,'vocab-list-main')}</div>
        <div class="vocab-meta">
          <div class="vocab-romanji">${esc(w.r)}</div>
          <div class="vocab-meaning">${esc(w.m)}</div>
        </div>
        <button class="mini-speak" onclick="speak('${esc(w.w)}')">🔊</button>
        <button class="mini-speak" onclick="openSpeechEnc('${enc(w.w)}','${enc(w.r)}','${enc(w.m)}')">🎤</button>
      </div>`).join('') + `</div>`;
  }
  app.innerHTML = `
    <div class="backrow">
      <button class="backbtn" onclick="goLearnGrid()">←</button>
      <h2 class="section-title">Đã học xong ${isVocabTable()?'chủ đề':'nhóm'} ${esc(g.label)}</h2>
    </div>
    <p class="section-sub">${countLine} Bấm 🔊 để nghe cách đọc.</p>
    ${body}
    <button class="primary-btn" onclick="startReviewOfGroup(${state.fromVocabGroup})">Ôn tập ${isVocabTable()?'chủ đề':'nhóm'} này ngay</button>
    <button class="secondary-btn" onclick="goLearnGrid()">Học ${isVocabTable()?'chủ đề':'nhóm'} khác</button>
    <button class="secondary-btn" onclick="goHome()">Về trang chủ</button>
  `;
}

function startReviewOfGroup(gi){
  state.selected = new Set(groups()[gi].chars.filter(c=>!c.special).map(c=>c.k));
  state.reviewMode = 'quiz';
  beginQuiz();
}

/* =====================================================================
   REVIEW PICKER (shared by quiz / flip / match) — chọn từng chữ/mục riêng lẻ
===================================================================== */
const MODE_HEADING = { quiz:'Chọn chữ muốn ôn tập', flip:'Chọn chữ muốn luyện nhanh', match:'Chọn chữ muốn ghép cặp' };
const MODE_BTN = { quiz:'Bắt đầu ôn tập', flip:'Bắt đầu lật thẻ', match:'Bắt đầu ghép cặp' };

function badgeHtml(table, key, inline){
  const score = masteryOf(table, key);
  const tier = masteryTier(score);
  const cls = 'ct-badge ' + tier.cls + (inline?' ct-badge-inline':'');
  return `<span class="${cls}" title="${tier.label}${score===null?'':' · '+score+'/100'}">${score===null?'–':score}</span>`;
}

function renderReviewPicker(){
  const itemWord = isVocabTable() ? 'mục' : 'chữ';
  const sectionsHtml = groups().map((g,gi)=>{
    const nonSpecial = g.chars.filter(c=>!c.special);
    if(nonSpecial.length===0) return '';
    const allSelected = nonSpecial.every(c=>state.selected.has(c.k));
    const groupToggleLabel = allSelected ? 'Bỏ chọn nhóm' : 'Chọn cả nhóm';
    let itemsHtml;
    if(isVocabTable()){
      itemsHtml = nonSpecial.map(c=>{
        const sel = state.selected.has(c.k);
        return `<div class="vocab-pick-row ${sel?'selected':''}" onclick="toggleChar('${esc(c.k).replace(/'/g,"\\'")}')">
          <span class="vpr-check">${sel?'✓':''}</span>
          <span class="vpr-text">${esc(c.k)}</span>
          ${badgeHtml(state.table, c.k, true)}
        </div>`;
      }).join('');
    } else {
      itemsHtml = `<div class="char-grid">` + nonSpecial.map(c=>{
        const sel = state.selected.has(c.k);
        return `<div class="char-tile ${sel?'selected':''}" onclick="toggleChar('${esc(c.k).replace(/'/g,"\\'")}')">
          <span class="ct-glyph">${esc(c.k)}</span>
          ${badgeHtml(state.table, c.k, false)}
        </div>`;
      }).join('') + `</div>`;
    }
    return `<div class="picker-section">
      <div class="picker-section-head">
        <span>${esc(g.label)}</span>
        <button class="chip-btn" onclick="toggleGroupChars(${gi})">${groupToggleLabel}</button>
      </div>
      ${itemsHtml}
    </div>`;
  }).join('');

  const minNeeded = state.reviewMode==='match' ? 4 : 3;
  const canStart = state.selected.size >= minNeeded;
  app.innerHTML = `
    <div class="backrow">
      <button class="backbtn" onclick="goTableMenu()">←</button>
      <h2 class="section-title">${MODE_HEADING[state.reviewMode]}</h2>
    </div>
    <p class="section-sub">Chạm từng ${itemWord} để chọn/bỏ chọn riêng, hoặc bấm "Chọn cả nhóm". Cần ít nhất ${minNeeded} ${itemWord} để bắt đầu.</p>
    <p class="mastery-legend">Số ở góc = độ thành thạo: <span class="m-poor">&lt;40 chưa tốt</span> · <span class="m-ok">40-64 ổn</span> · <span class="m-good">65-84 tốt</span> · <span class="m-great">85-100 giỏi</span> · “–” là chưa luyện</p>
    <div class="quickrow">
      <button class="chip-btn" onclick="selectOnlyLearnedChars()">Chỉ ${itemWord} đã học</button>
      <button class="chip-btn" onclick="selectAllChars()">Chọn tất cả</button>
      <button class="chip-btn" onclick="clearChars()">Bỏ chọn tất cả</button>
    </div>
    ${sectionsHtml}
    <div class="selcount">Đã chọn <b>${state.selected.size}</b> ${itemWord}.</div>
    <button class="primary-btn" ${canStart?'':'disabled'} onclick="startReviewMode()">${MODE_BTN[state.reviewMode]}</button>
  `;
}
function toggleChar(key){
  if(state.selected.has(key)) state.selected.delete(key); else state.selected.add(key);
  render();
}
function toggleGroupChars(gi){
  const nonSpecial = groups()[gi].chars.filter(c=>!c.special);
  const allSelected = nonSpecial.every(c=>state.selected.has(c.k));
  nonSpecial.forEach(c=>{ if(allSelected) state.selected.delete(c.k); else state.selected.add(c.k); });
  render();
}
function selectAllChars(){
  state.selected = new Set(groups().flatMap(g=>g.chars.filter(c=>!c.special).map(c=>c.k)));
  render();
}
function clearChars(){ state.selected = new Set(); render(); }
function selectOnlyLearnedChars(){ state.selected = learnedChars(); render(); }

function startReviewMode(){
  if(state.reviewMode==='flip') beginFlip();
  else if(state.reviewMode==='match') beginMatch();
  else beginQuiz();
}

/* =====================================================================
   QUIZ (typing + handwriting)
===================================================================== */
function isPhrase(c){ return /\s/.test((c.r||'').trim()); }
function vocabTypesFor(c){
  const hasR = !!((c.r||'').trim());
  if(!hasR) return ['vocabMeaning','vocabMeaningChoice','listenChoice'];
  if(isPhrase(c)) return ['vocabMeaningChoice','vocabScramble','listenChoice'];
  return ['vocabMeaning','vocabReading','listenChoice'];
}

function beginQuiz(){
  const pool = poolFromSelectedKeys(state.selected);
  let specs = [];
  if(state.table==='kanji'){
    pool.forEach(c=>{ specs.push({type:'kanjiMeaning', c}); specs.push({type:'kanjiReading', c}); specs.push({type:'kanjiWrite', c}); specs.push({type:'listenChoice', c}); });
  } else if(isVocabTable()){
    pool.forEach(c=>{ vocabTypesFor(c).forEach(t=>specs.push({type:t, c})); });
  } else {
    const cs = state.selected;
    const wpool = wordsWithinChars(cs);
    pool.forEach(c=>{ specs.push({type:'char2romanji', c}); specs.push({type:'romanji2char', c}); specs.push({type:'listenChoice', c}); });
    wpool.forEach(w=>{ specs.push({type:'word2romanji', w}); });
  }
  specs = shuffle(specs);
  const N = Math.max(6, Math.min(16, specs.length));
  specs = specs.slice(0, N);

  state.quiz = { items: specs, idx:0, correct:0, misses:[], answered:false, pool };
  state.screen = 'quiz';
  render();
}

function currentSpec(){ return state.quiz.items[state.quiz.idx]; }

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (ok?'ok':'bad');

  document.getElementById('nextBtn').classList.add('show');
  const cb = document.getElementById('checkBtn'); if(cb) cb.disabled = true;
}
function recordAnswer(ok, missLabel, charKey, specType){
  const q = state.quiz;
  q.answered = true;
  if(ok) q.correct++;
  else q.misses.push(missLabel);
  trackActivity(ok);
  if(charKey){
    const elapsed = elapsedMs();
    q.lastElapsed = elapsed;
    const perf = computePerf(ok, elapsed, specType);
    updateMastery(state.table, charKey, perf);
  }
}
function elapsedMs(){
  if(typeof state.quiz.qElapsedOverride === 'number') return state.quiz.qElapsedOverride;
  const start = state.quiz.qStart || Date.now();
  return Date.now() - start;
}
function elapsedForWrite(){
  const start = state.quiz.qStart || Date.now();
  const end = state.quiz.qRevealAt || Date.now();
  return end - start;
}

/* ---- handwriting canvas ---- */
let _writeDrawing = false;
function initWriteCanvas(){
  const canvas = document.getElementById('writeCanvas');
  if(!canvas) return;
  const size = 400;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 16;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1c2c46';

  function posFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
  }
  function lockScroll(){ document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden'; }
  function unlockScroll(){ document.documentElement.style.overflow=''; document.body.style.overflow=''; }
  function down(e){
    e.preventDefault();
    _writeDrawing = true;
    lockScroll();
    const p = posFromEvent(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  }
  function move(e){
    if(!_writeDrawing) return;
    e.preventDefault();
    const p = posFromEvent(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  function up(e){
    if(e) e.preventDefault();
    _writeDrawing = false;
    unlockScroll();
  }
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', up);
  canvas.addEventListener('touchstart', e=>e.preventDefault(), {passive:false});
  canvas.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
}
function clearWriteCanvas(){
  const canvas = document.getElementById('writeCanvas');
  if(!canvas) return;
  canvas.getContext('2d').clearRect(0,0,canvas.width, canvas.height);
}
function revealWriteAnswer(){
  const overlay = document.getElementById('writeOverlay');
  if(overlay) overlay.classList.add('show');
  const grading = document.getElementById('writeGrading');
  if(grading) grading.classList.add('show');
  const revealBtn = document.getElementById('revealBtn');
  if(revealBtn) revealBtn.disabled = true;
  if(state.quiz) state.quiz.qRevealAt = Date.now();
}

    ${q.misses.length ? '<button class="primary-btn" onclick="reviewMisses()">Ôn lại các câu sai</button>' : ''}
    <button class="secondary-btn" onclick="beginQuiz()">Ôn tập lại từ đầu (bộ chữ này)</button>
    <button class="secondary-btn" onclick="goReviewPicker('quiz')">Chọn chữ khác</button>
    <button class="secondary-btn" onclick="goHome()">Về trang chủ</button>
  `;
}

function reviewMisses(){
  const q = state.quiz;
  const missedCharKeys = new Set();
  const missedWords = new Set();
  q.misses.forEach(m=>{
    if(state.table!=='kanji' && state.table!=='vocab'){
      const wm = words().find(w=>w.w===m.k || w.r===m.k);
      if(wm){ missedWords.add(wm.w); return; }
    }
    const cm = q.pool.find(c=>c.k===m.k || c.k===m.correct);
    if(cm) missedCharKeys.add(cm.k);
  });
  let specs = [];
  if(state.table==='kanji'){
    q.pool.forEach(c=>{ if(missedCharKeys.has(c.k)){ specs.push({type:'kanjiMeaning',c}); specs.push({type:'kanjiReading',c}); specs.push({type:'kanjiWrite',c}); specs.push({type:'listenChoice',c}); } });
  } else if(isVocabTable()){
    q.pool.forEach(c=>{ if(missedCharKeys.has(c.k)){ vocabTypesFor(c).forEach(t=>specs.push({type:t, c})); } });
  } else {
    q.pool.forEach(c=>{ if(missedCharKeys.has(c.k)){ specs.push({type:'char2romanji',c}); specs.push({type:'romanji2char',c}); specs.push({type:'listenChoice',c}); } });
    words().forEach(w=>{ if(missedWords.has(w.w)) specs.push({type:'word2romanji', w}); });
  }
  if(specs.length===0){ beginQuiz(); return; }
  specs = shuffle(specs);
  state.quiz = { items: specs, idx:0, correct:0, misses:[], answered:false, pool:q.pool };
  state.screen = 'quiz';
  render();
}

/* =====================================================================
   FLIP-CARD MODE (lật thẻ luyện nhanh, có xếp lại thẻ chưa nhớ)
===================================================================== */
function beginFlip(){
  const pool = poolFromSelectedKeys(state.selected);
  if(pool.length < 3){ alert('Chọn ít nhất 3 chữ để luyện.'); return; }
  state.flip = { queue: shuffle(pool), flipped:false, known:0, total:pool.length, cardShownAt: Date.now(), lastElapsed:0 };
  state.screen = 'flip';
  render();
}
function renderFlip(){
  const f = state.flip;
  if(f.queue.length===0){
    app.innerHTML = `
      <div class="result-score"><div class="big">🎉</div><div class="pct">Đã ôn xong ${f.total} thẻ!</div></div>
      <button class="primary-btn" onclick="beginFlip()">Luyện lại</button>
      <button class="secondary-btn" onclick="goReviewPicker('flip')">Chọn chữ khác</button>
      <button class="secondary-btn" onclick="goHome()">Về trang chủ</button>
    `;
    return;
  }
  const c = f.queue[0];
  const backHtml = cardBackHtml(c);
  const glyphStyle = (isVocabTable() && c.k.length>8) ? 'style="font-size:32px;"' : '';
  app.innerHTML = `
    <div class="quiz-top"><span>Còn lại ${f.queue.length} thẻ</span><span class="quiz-score">Đã nhớ ${f.known}/${f.total}</span></div>
    <div class="card-stage flip-card" onclick="${f.flipped?'':'flipCard()'}">
      <div class="flash-glyph" ${glyphStyle}>${srsFront}</div>
      ${f.flipped ? backHtml : '<div class="flip-hint">Chạm vào thẻ để lật 👆</div>'}
    </div>
    ${f.flipped ? `
    <div style="display:flex; gap:10px; margin-top:14px;">
      <button class="check-btn bad-btn" onclick="flipAnswer(false)">😅 Chưa nhớ</button>
      <button class="check-btn ok-btn" onclick="flipAnswer(true)">✅ Nhớ rồi</button>
    </div>` : ''}
  `;
}
function flipCard(){
  const f = state.flip;
  f.lastElapsed = Date.now() - (f.cardShownAt || Date.now());
  f.flipped = true;
  render();
}
function flipAnswer(known){
  const f = state.flip;
  const c = f.queue.shift();
  f.flipped = false;
  if(known) f.known++;
  else f.queue.splice(Math.min(3, f.queue.length), 0, c);
  trackActivity(known);
  const perf = computePerf(known, f.lastElapsed, 'flip');
  updateMastery(state.table, c.k, perf);
  if(f.queue.length>0) f.cardShownAt = Date.now();
  render();
}

/* =====================================================================
   MATCHING GAME (ghép cặp)
===================================================================== */
function beginMatch(){
  const pool = poolFromSelectedKeys(state.selected);
  if(pool.length < 4){ alert('Chọn ít nhất 4 chữ để chơi ghép cặp.'); return; }
  const chosen = shuffle(pool).slice(0, Math.min(8, pool.length));
  const left = chosen.map(c=>({id:c.k+'_L', key:c.k, label:c.k, matched:false}));
  const right = chosen.map(c=>{
    let label;
    if(state.table==='kanji') label = c.meaning.split(',')[0].trim();
    else if(isVocabTable()) label = c.m.split(',')[0].trim();
    else label = c.special ? '(đặc biệt)' : c.r;
    return {id:c.k+'_R', key:c.k, label, matched:false};
  });
  state.match = {
    left: shuffle(left), right: shuffle(right),
    pickedLeft:null, pickedRight:null,
    matchedCount:0, total:chosen.length, mistakes:0,
    startTime: Date.now(), wrongFlash:null,
  };
  state.screen = 'match';
  render();
}
function renderMatch(){
  const m = state.match;
  if(m.matchedCount === m.total){
    const secs = Math.round((Date.now()-m.startTime)/1000);
    app.innerHTML = `
      <div class="result-score"><div class="big">🎉</div><div class="pct">Ghép xong ${m.total} cặp trong ${secs}s — sai ${m.mistakes} lần</div></div>
      <button class="primary-btn" onclick="beginMatch()">Chơi lại</button>
      <button class="secondary-btn" onclick="goReviewPicker('match')">Chọn chữ khác</button>
      <button class="secondary-btn" onclick="goHome()">Về trang chủ</button>
    `;
    return;
  }
  function tileHtml(c, side){
    let cls = 'match-tile';
    if(c.matched) cls += ' matched';
    else if(m.wrongFlash && (m.wrongFlash.left===c.id || m.wrongFlash.right===c.id)) cls += ' wrong';
    else if(side==='left' && m.pickedLeft && m.pickedLeft.id===c.id) cls += ' picked';
    else if(side==='right' && m.pickedRight && m.pickedRight.id===c.id) cls += ' picked';
    const clickable = !c.matched && !m.wrongFlash;
    const smallStyle = (isVocabTable() && c.label.length>7) ? 'style="font-size:11.5px; line-height:1.3;"' : '';
    return `<div class="${cls}" ${smallStyle} ${clickable?`onclick="pickMatch('${side}','${esc(c.id)}')"`:''}>${esc(c.label)}</div>`;
  }
  const leftHtml = m.left.map(c=>tileHtml(c,'left')).join('');
  const rightHtml = m.right.map(c=>tileHtml(c,'right')).join('');
  app.innerHTML = `
    <div class="quiz-top"><span>Đã ghép ${m.matchedCount}/${m.total} cặp</span><span class="quiz-score">Sai ${m.mistakes} lần</span></div>
    <p class="section-sub">Chạm 1 ô chữ bên trái và 1 ô nghĩa/âm đọc bên phải khớp với nhau.</p>
    <div class="match-grid">
      <div class="match-col">${leftHtml}</div>
      <div class="match-col">${rightHtml}</div>
    </div>
  `;
}
function pickMatch(side, id){
  const m = state.match;
  if(m.wrongFlash) return;
  if(side==='left'){
    const c = m.left.find(x=>x.id===id); if(!c || c.matched) return;
    m.pickedLeft = c;
  } else {
    const c = m.right.find(x=>x.id===id); if(!c || c.matched) return;
    m.pickedRight = c;
  }
  if(m.pickedLeft && m.pickedRight){
    if(m.pickedLeft.key === m.pickedRight.key){
      const matchedKey = m.pickedLeft.key;
      m.pickedLeft.matched = true; m.pickedRight.matched = true;
      m.matchedCount++;
      m.pickedLeft = null; m.pickedRight = null;
      trackActivity(true);
      updateMastery(state.table, matchedKey, 75);
      render();
    } else {
      m.mistakes++;
      m.wrongFlash = { left:m.pickedLeft.id, right:m.pickedRight.id };
      trackActivity(false);
      render();
      setTimeout(()=>{ m.wrongFlash=null; m.pickedLeft=null; m.pickedRight=null; render(); }, 550);
    }
  } else {
    render();
  }
}

function allEntries(){
  const out = [];
  HIRA_GROUPS.forEach(g=>g.chars.forEach(c=>{ if(!c.special) out.push({table:'hiragana', label:'Hira', c}); }));
  KATA_GROUPS.forEach(g=>g.chars.forEach(c=>{ if(!c.special) out.push({table:'katakana', label:'Kata', c}); }));
  KANJI_GROUPS.forEach(g=>g.chars.forEach(c=>{ out.push({table:'kanji', label:'Kanji', c}); }));
  VOCAB_GROUPS.forEach(g=>g.chars.forEach(c=>{ out.push({table:'vocab', label:'Từ vựng', c}); }));
  KANA_ALL.custom.forEach(g=>g.chars.forEach(c=>{ out.push({table:'custom', label:'Bộ của tôi', c}); }));
  return out;
}
function renderLookup(){
  app.innerHTML = `
    <div class="backrow">
      <button class="backbtn" onclick="goHome()">←</button>
      <h2 class="section-title">Tra cứu nhanh</h2>
    </div>
    <p class="section-sub">Gõ chữ Hiragana/Katakana/Kanji, romanji, hoặc nghĩa tiếng Việt.</p>
    <div class="answer-row">
      <input class="answer-input" id="lookupInput" type="text" placeholder="Ví dụ: ka, 水, núi..." autocomplete="off" spellcheck="false" oninput="doLookup()">
    </div>
    <div id="lookupResults" class="vocab-list" style="margin-top:14px;"></div>
  `;
  document.getElementById('lookupInput').focus();
}
function doLookup(){
  const raw = document.getElementById('lookupInput').value;
  const box = document.getElementById('lookupResults');
  const q = norm(raw), qm = normMeaning(raw);
  if(!q){ box.innerHTML=''; return; }
  const results = allEntries().filter(e=>{
    const c = e.c;
    if(c.k === raw) return true;
    if(e.table === 'kanji'){
      if(c.example.romanji && norm(c.example.romanji).includes(q)) return true;
      if(c.meaning && normMeaning(c.meaning).includes(qm)) return true;
      if(c.on.some(o=>o.includes(raw))) return true;
      if(c.kun.some(k=>k.includes(raw))) return true;
    } else if(e.table === 'vocab' || e.table === 'custom'){
      if(c.r && norm(c.r).includes(q)) return true;
      if(c.m && normMeaning(c.m).includes(qm)) return true;
    } else {
      if(c.r && norm(c.r).includes(q)) return true;
      if(c.alt && c.alt.some(a=>norm(a).includes(q))) return true;
    }
    return false;
  }).slice(0,20);
  if(results.length===0){ box.innerHTML = '<div class="empty-note">Không tìm thấy kết quả phù hợp.</div>'; return; }
  box.innerHTML = results.map(e=>{
    const c = e.c;
    let sub;
    if(e.table==='kanji') sub = `${esc(c.meaning)} · On: ${esc(c.on.join('、')||'—')} · Kun: ${esc(c.kun.join('、')||'—')}`;
    else if(e.table==='vocab' || e.table==='custom') sub = `${esc(c.r||'')} ${c.r?'— ':''}${esc(c.m)}`;
    else sub = (c.r || '(âm đặc biệt)');
    const speakTxt = e.table==='kanji' ? c.example.kana : c.k;
    return `<div class="vocab-item">
      <div class="vocab-kana">${esc(c.k)}</div>
      <div class="vocab-meta">
        <div class="vocab-romanji">${esc(e.label)}</div>
        <div class="vocab-meaning">${sub}</div>
      </div>
      <button class="mini-speak" onclick="speak('${esc(speakTxt)}')">🔊</button>
    </div>`;
  }).join('');
}

/* =====================================================================
   LUYỆN NÓI — Web Speech API (SpeechRecognition ja-JP)
===================================================================== */
function getSR(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
function kataToHira(s){ return (s||'').replace(/[\u30A1-\u30F6]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)); }
function normSpeech(s){ return kataToHira((s||'').toLowerCase()).replace(/[\s。、！？!?,.，．・「」『』〜~ー\-']/g,''); }
function lev(a,b){
  const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); }
    prev=cur;
  }
  return prev[n];
}
function simScore(target, said){
  const A=normSpeech(target), B=normSpeech(said);
  if(!A||!B) return 0;
  return Math.max(0, Math.round((1 - lev(A,B)/Math.max(A.length,B.length))*100));
}
function speechTier(sc){
  if(sc>=85) return {t:'Rất chuẩn! 🎉', cls:'m-great'};
  if(sc>=65) return {t:'Khá tốt 👍', cls:'m-good'};
  if(sc>=40) return {t:'Gần đúng, thử lại nhé', cls:'m-ok'};
  return {t:'Chưa khớp — nghe mẫu rồi thử lại', cls:'m-poor'};
}
let _recObj = null;
function recognizeOnce(cb){
  const SRc = getSR();
  if(!SRc){ cb({error:'unsupported'}); return null; }
  try{ if(_recObj) _recObj.abort(); }catch(e){}
  let rec, got=false;
  try{ rec = new SRc(); }catch(e){ cb({error:'start-failed'}); return null; }
  rec.lang='ja-JP'; rec.interimResults=false; rec.maxAlternatives=5; rec.continuous=false;
  rec.onresult = e=>{
    if(got) return; got=true;
    const r=e.results[0], alts=[];
    for(let i=0;i<r.length;i++) alts.push({t:r[i].transcript, c:r[i].confidence});
    cb({alts});
  };
  rec.onerror = e=>{ if(got) return; got=true; cb({error:(e&&e.error)||'error'}); };
  rec.onend = ()=>{ if(got) return; got=true; cb({error:'no-speech'}); };
  _recObj = rec;
  try{ rec.start(); }catch(err){ got=true; cb({error:'start-failed'}); }
  return rec;
}

function openSpeechEnc(t,r,m){ openSpeech(decodeURIComponent(t), decodeURIComponent(r), decodeURIComponent(m)); }
function openSpeech(text,r,m){ _sp={text,r,m,status:'idle',alts:[],score:null,err:null}; renderSpeechModal(); }
function closeSpeech(){

}
function speechErrText(e){
  if(e==='unsupported') return 'Trình duyệt này chưa hỗ trợ nhận diện giọng nói. Hãy dùng Chrome, Edge hoặc Safari bản mới.';
  if(e==='not-allowed' || e==='service-not-allowed') return 'Trình duyệt chưa được cấp quyền dùng micro. Hãy bấm "Cho phép" khi trình duyệt hỏi, hoặc bật quyền micro trong cài đặt trang.';
  if(e==='no-speech') return 'Không nghe thấy giọng nói. Hãy nói to và rõ hơn, rồi thử lại.';
  if(e==='audio-capture') return 'Không tìm thấy micro trên thiết bị.';
  if(e==='network') return 'Nhận diện giọng nói cần kết nối mạng (trình duyệt gửi âm thanh lên máy chủ để nhận diện).';

          <button class="chip-btn" onclick="speak(_sp.text)">🔊 Nghe mẫu</button>

        </div>

          ? `<button class="primary-btn" id="spMicBtn" ${listening?'disabled':''} onclick="spStart()">${listening?'🎙️ Đang nghe… hãy nói':(sp.status==='idle'?'🎤 Bấm rồi đọc to':'🎤 Thử lại')}</button>`

}
function spStart(){
  if(!_sp || _sp.status==='listening') return;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  _sp.status='listening'; _sp.err=null; renderSpeechModal();
  const mySp=_sp;
  recognizeOnce(res=>{
    if(_sp!==mySp) return;
    if(res.error){ mySp.status='error'; mySp.err=res.error; }
    else {
      res.alts.forEach(a=>{ a.sc=simScore(mySp.text,a.t); });
      mySp.alts=res.alts; mySp.score=Math.max(...res.alts.map(a=>a.sc)); mySp.status='done';
      LS.speech.count++; LS.speech.sum+=mySp.score; trackActivity(mySp.score>=60); saveLS();
    }
    renderSpeechModal();
  });
}

/* =====================================================================
   SRS — lặp lại ngắt quãng theo ngày (kiểu Anki)
   Quên → mai ôn lại · Nhớ → 3 ngày (lần sau ×hệ số) · Xuất sắc → 7 ngày
===================================================================== */
function addDaysStr(str,n){ const d=new Date(str+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); }
function srsEntry(table,key){ return (LS.srs[table]||{})[key]||null; }
function srsNext(e,grade){
  const ease=e?e.ease:2.5, reps=e?e.reps:0, ivl=e?e.ivl:0;
  if(grade==='again') return {ivl:1, ease:Math.max(1.3,ease-0.2), reps:0, lapse:true};
  if(grade==='good'){
    const n = reps===0 ? 3 : Math.max(ivl+1, Math.round(ivl*ease));
    return {ivl:Math.min(n,180), ease, reps:reps+1};
  }
  const n = reps===0 ? 7 : Math.max(ivl+2, Math.round(ivl*ease*1.3));
  return {ivl:Math.min(n,180), ease:ease+0.15, reps:reps+1};
}
function srsApply(table,key,grade){
  const e=srsEntry(table,key), n=srsNext(e,grade);
  LS.srs[table][key]={ ivl:n.ivl, ease:n.ease, reps:n.reps, lapses:(e&&e.lapses||0)+(n.lapse?1:0), due:addDaysStr(todayStr(),n.ivl) };
  saveLS(); return n.ivl;
}
function allItems(table){ return (KANA_ALL[table]||[]).flatMap(g=>g.chars).filter(c=>!c.special); }
function srsDueList(table){
  const t=todayStr(), m=LS.srs[table]||{};
  return allItems(table).filter(c=>m[c.k] && m[c.k].due<=t);
}
function srsNewList(table){
  const m=LS.srs[table]||{}, out=[];
  (LS.learned[table]||[]).forEach(gi=>{
    const g=(KANA_ALL[table]||[])[gi]; if(!g) return;
    g.chars.forEach(c=>{ if(!c.special && !m[c.k]) out.push(c); });
  });
  return out;
}
function fmtDays(n){ return n+' ngày'; }
function beginSrs(){
  const t=state.table, m=LS.srs[t]||{};
  const due=srsDueList(t).sort((a,b)=> m[a.k].due<m[b.k].due?-1:1);
  const fresh=shuffle(srsNewList(t)).slice(0,10);
  const queue=due.concat(fresh).map(c=>({c, retry:false}));
  state.srs={ queue, flipped:false, total:queue.length, done:0, again:0, dueCount:due.length, newCount:fresh.length };
  state.screen='srs'; render();
}
function srsFlip(){ state.srs.flipped=true; render(); }
function srsGrade(g){
  const S=state.srs, it=S.queue.shift(), c=it.c;
  S.flipped=false;
  if(!it.retry){
    srsApply(state.table,c.k,g); S.done++;
    trackActivity(g!=='again');
    updateMastery(state.table,c.k,{again:0,good:80,easy:100}[g]);
  }
  if(g==='again'){ S.again++; S.queue.splice(Math.min(3,S.queue.length),0,{c,retry:true}); }
  render();
}
function srsNextDueLabel(table){
  const t=todayStr(), m=LS.srs[table]||{};
  const future=Object.values(m).map(e=>e.due).filter(d=>d>t).sort();
  return future.length ? future[0].split('-').reverse().join('/') : null;
}

    const nxt=srsNextDueLabel(state.table);
    app.innerHTML=`

      <p class="section-sub" style="text-align:center;">${nxt?`Thẻ tiếp theo đến hạn vào ngày <b>${nxt}</b>.`:'Hãy học nhóm mới để có thẻ vào lịch ôn.'}</p>

    : {again:`😅 Quên<small>${fmtDays(srsNext(e,'again').ivl)}</small>`, good:`👍 Nhớ<small>${fmtDays(srsNext(e,'good').ivl)}</small>`, easy:`🌟 Xuất sắc<small>${fmtDays(srsNext(e,'easy').ivl)}</small>`};

    <div class="quiz-top"><span>Còn ${S.queue.length} thẻ · ${S.dueCount} đến hạn · ${S.newCount} mới</span><span class="quiz-score">${S.done}/${S.total}</span></div>

      <div class="flash-glyph" ${glyphStyle}>${esc(c.k)}</div>

    </div>

      <button class="srs-btn again" onclick="srsGrade('again')">${gl.again}</button>

}

  app.innerHTML=`

function openGrammar(i){ state.gp={i, ok:{}, wrong:{}}; state.screen='grammarView'; render(); }
function blankSentence(e, filled){
  return grammarSentenceDisplay(e,filled);
}
function renderGrammarView(){
  const g=GRAMMAR[state.gp.i], gp=state.gp;
  const exHtml=g.ex.map((e,j)=>{
    const solved=!!gp.ok[j];
    return `<div class="gp-ex">
      <div class="gp-sentence">${grammarSentenceDisplay(e,solved)}</div>
      <div class="gp-opts">${e.opts.map(o=>`<button class="gp-opt ${solved&&o===e.ans?'correct':''} ${(gp.wrong[j]||[]).includes(o)?'wrong':''}" ${solved?'disabled':''} onclick="gpPick(${j},'${o}')">${esc(o)}</button>`).join('')}</div>
      ${solved?`<div class="gp-done"><div class="q-hint" style="color:var(--indigo);">${esc(e.r)}</div><div class="q-hint">${esc(e.m)}</div>
        <button class="mini-speak" onclick="speak('${esc(e.jp)}')">🔊</button></div>`:''}
    </div>`;
  }).join('');
  const allDone=g.ex.every((_,j)=>gp.ok[j]);
  app.innerHTML=`
    <div class="backrow"><button class="backbtn" onclick="openGrammarList()">←</button><h2 class="section-title" style="font-size:16px;">${esc(g.title)}</h2></div>
    <div class="gp-formula">${esc(g.formula)}</div>

      <div class="vocab-meta">${jpDisplay(x.jp,x.r,'grammar-example')}<div class="vocab-meaning">${esc(x.m)}</div></div>
      <button class="mini-speak" onclick="speak('${esc(x.jp)}')">🔊</button>
      <button class="mini-speak" onclick="openSpeechEnc('${enc(x.jp)}','${enc(x.r)}','${enc(x.m)}')">🎤</button></div>`).join('')}</div>
    <h2 class="section-title" style="font-size:14px;">Điền vào chỗ trống</h2>
    ${exHtml}
    ${allDone?'<div class="feedback show ok" style="margin-top:12px;"><b>Hoàn thành cấu trúc này! 🎉</b></div>':''}
    <div style="display:flex; gap:8px; margin-top:14px;">
      ${state.gp.i>0?`<button class="secondary-btn" style="margin:0;" onclick="openGrammar(${state.gp.i-1})">← Trước</button>`:''}
      ${state.gp.i<GRAMMAR.length-1?`<button class="primary-btn" style="margin:0;" onclick="openGrammar(${state.gp.i+1})">Tiếp →</button>`:''}
    </div>`;
}
function gpPick(j,opt){
  const g=GRAMMAR[state.gp.i], e=g.ex[j], gp=state.gp;
  if(gp.ok[j]) return;
  const ok = opt===e.ans;
  trackActivity(ok);
  if(ok){ gp.ok[j]=true; speak(e.jp); }
  else { gp.wrong[j]=(gp.wrong[j]||[]).concat(opt); }
  if(g.ex.every((_,k)=>gp.ok[k]) && !LS.grammar.done.includes(g.id)){ LS.grammar.done.push(g.id); saveLS(); }
  render();
}

function customHasKey(jp){ return LS.customDecks.some(d=>d.items.some(it=>it.jp===jp)); }
function addCustomItem(){
  const d=LS.customDecks[state.editDeck];
  const jp=document.getElementById('cdJp').value.trim(), r=document.getElementById('cdR').value.trim(), m=document.getElementById('cdM').value.trim();
  if(!jp||!m){ alert('Cần nhập tiếng Nhật và nghĩa tiếng Việt.'); return; }
  if(customHasKey(jp)){ alert('Mục "'+jp+'" đã có trong bộ từ của bạn.'); return; }
  d.items.push({jp,r,m}); saveLS(); rebuildCustom(); render();
  const f=document.getElementById('cdJp'); if(f) f.focus();
}
function bulkImportItems(){
  const d=LS.customDecks[state.editDeck];
  const lines=(document.getElementById('cdBulk').value||'').split('\n');
  let added=0, skipped=0;
  lines.forEach(line=>{
    const parts=line.split(/\s*[|\t]\s*/).map(x=>x.trim());
    if(parts.length<2 || !parts[0]){ if(line.trim()) skipped++; return; }
    const jp=parts[0], r=parts.length>=3?parts[1]:'', m=parts.length>=3?parts.slice(2).join(' | '):parts[1];
    if(!m || customHasKey(jp)){ skipped++; return; }
    d.items.push({jp,r,m}); added++;
  });
  saveLS(); rebuildCustom(); render();
  alert('Đã thêm '+added+' mục'+(skipped?', bỏ qua '+skipped+' dòng (trùng hoặc thiếu nghĩa)':'')+'.');
}
function delCustomItem(j){
  const d=LS.customDecks[state.editDeck]; d.items.splice(j,1); saveLS(); rebuildCustom(); render();
}
function deleteDeck(i){
  if(!confirm('Xoá chủ đề này và toàn bộ mục trong đó?')) return;
  LS.customDecks.splice(i,1);
  LS.learned.custom=(LS.learned.custom||[]).filter(x=>x!==i).map(x=>x>i?x-1:x);
  saveLS(); rebuildCustom(); openCustomList();
}

function startRoleplay(i){
  state.rp={ si:i, ti:0, history:[], note:null, mistakes:0, hint:true, done:false, opts:[] };
  rpEnterTurn(); state.screen='roleplay'; render();
}
function rpEnterTurn(){
  const rp=state.rp, t=ROLEPLAYS[rp.si].turns[rp.ti];
  rp.history.push({who:'bot', jp:t.bot.jp, r:t.bot.r, m:t.bot.m});
  rp.opts=shuffle(t.replies); rp.note=null;
  speak(t.bot.jp);
}
function rpAccept(reply){
  const rp=state.rp;
  rp.history.push({who:'me', jp:reply.jp, r:reply.r, m:reply.m});
  rp.ti++; trackActivity(true);
  if(rp.ti>=ROLEPLAYS[rp.si].turns.length){ rp.done=true; rp.note=null; } else rpEnterTurn();
  render();
}
function rpReject(reply){
  const rp=state.rp; rp.mistakes++; trackActivity(false);
  rp.note = reply.why || 'Câu này chưa hợp với tình huống, hãy thử lại.';
  render();
}
function rpChoose(i){ const r=state.rp.opts[i]; if(r.ok) rpAccept(r); else rpReject(r); }
function rpMatch(text, alts){
  const rp=state.rp, replies=ROLEPLAYS[rp.si].turns[rp.ti].replies;
  let best=null, bestSc=0;
  const cands=(alts&&alts.length)?alts:[text];
  replies.forEach(rep=>{
    cands.forEach(c=>{
      if(!normSpeech(c)) return;
      const sc=Math.max(simScore(rep.jp,c), simScore(rep.r,c));
      if(sc>bestSc){ bestSc=sc; best=rep; }
    });
  });
  if(best && bestSc>=70){ if(best.ok) rpAccept(best); else rpReject(best); }
  else { rp.note='Mình chưa hiểu câu này khớp với gợi ý nào. Thử gõ romanji của một gợi ý, hoặc bấm chọn trực tiếp.'; render(); }
}
function rpSubmitText(){
  const v=(document.getElementById('rpInput').value||'').trim();
  if(!v) return; rpMatch(v,null);
}
function rpMic(){
  if(!getSR()){ state.rp.note=speechErrText('unsupported'); render(); return; }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  state.rp.note='🎙️ Đang nghe… hãy nói câu trả lời của bạn'; render();
  recognizeOnce(res=>{
    if(state.screen!=='roleplay') return;
    if(res.error){ state.rp.note=speechErrText(res.error); render(); }
    else rpMatch(res.alts[0].t, res.alts.map(a=>a.t));
  });
}
